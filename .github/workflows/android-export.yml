name: Export Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Export Android APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://downloads.godotengine.org/?version=4.7.1&flavor=stable&slug=linux.x86_64.zip&platform=linux.64
          godot_export_templates_download_url: https://downloads.godotengine.org/?version=4.7.1&flavor=stable&slug=export_templates.tpz&platform=templates
          relative_project_path: ./
          export_debug: true
          presets_to_export: Android
          verbose: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: beastcaller-debug-apk
          path: ${{ steps.export.outputs.build_directory }}/*
